# 프론트 컨테이너의 Nginx 설정.
# 역할 2가지: (1) 정적 파일(HTML/CSS/JS) 서빙, (2) /api/ 요청을 백엔드로 프록시.
# 프론트와 API가 같은 origin(이 nginx)으로 보이므로 브라우저 CORS 문제가 사라진다.

# HTTPS 도입: 앞단 프록시(caddy)가 보낸 X-Forwarded-Proto/Port가 있으면 승계,
# 직접 노출(8070 등)일 때만 내 값을 쓴다 — 상세 설명은 frontend/nginx.conf.
map $http_x_forwarded_proto $fwd_proto {
  ""      $scheme;
  default $http_x_forwarded_proto;
}
map $http_x_forwarded_port $fwd_port {
  ""      $server_port;
  default $http_x_forwarded_port;
}

# server: 하나의 가상 호스트(요청을 받아 처리하는 단위)를 정의한다.
server {
  # listen: 이 서버가 대기할 포트. 컨테이너 내부 80번(밖에서 8070으로 매핑).
  listen 80;
  # server_name: 어떤 호스트명 요청을 받을지. "_" 는 "아무 이름이나"(기본 서버) 의미.
  server_name _;

  # ── (1) 정적 파일 서빙 ──
  # root: 정적 파일을 찾을 최상위 디렉터리. 요청 경로가 이 밑에서 매핑된다.
  # 단계 15 배포에서 발견된 함정의 해결: proxy_pass에 호스트명을 정적으로 쓰면 nginx가
  # 기동 시 1회만 IP를 해석해, 백엔드 컨테이너만 재생성되는 배포(GHCR pull) 후 502가 난다.
  # resolver(도커 내장 DNS 127.0.0.11) + 변수를 쓰면 요청마다 재해석해 새 IP를 따라간다.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend board-app:8090;

  root /usr/share/nginx/html;
  # index: 디렉터리(/)로 들어왔을 때 기본으로 내보낼 파일.
  index index.html;

  # location /: 모든 경로에 매칭되는 기본 규칙(더 구체적인 location이 우선).
  location / {
    # try_files: 순서대로 파일을 찾아 첫 번째로 존재하는 것을 응답한다.
    #   $uri(정확한 파일) → $uri/(디렉터리) → 둘 다 없으면 /index.html 로 폴백.
    #   SPA는 아니지만, 없는 경로도 index.html로 떨어뜨려 단순화한다.
    try_files $uri $uri/ /index.html;
  }

  # ── (2) API 프록시 ──
  # location /api/: "/api/" 로 시작하는 요청만 이 블록이 처리한다.
  location /api/ {
    # proxy_pass: 요청을 넘길 대상(업스트림). 뒤에 경로(/)를 붙이지 않아야
    #   원본 URI(/api/v1/boards)가 그대로 백엔드에 전달된다. "board-app"은 같은
    #   docker 네트워크(board-db-net)의 백엔드 컨테이너명으로 DNS 해석된다.
    proxy_pass http://$backend;
    # proxy_http_version: 백엔드와 HTTP/1.1로 통신(keep-alive·청크 등 기본 권장값).
    proxy_http_version 1.1;
    # proxy_set_header: 백엔드로 넘길 요청 헤더를 지정/보정한다.
    #   Host: 원래 요청의 호스트명을 그대로 전달(백엔드가 baseUrl 등 계산에 사용).
    proxy_set_header Host $host;
    #   X-Real-IP: 실제 클라이언트 IP(프록시를 거치면 원본이 가려지므로 명시).
    proxy_set_header X-Real-IP $remote_addr;
    #   X-Forwarded-For: 거쳐온 프록시/클라이언트 IP 체인(로그·감사용).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #   X-Forwarded-Proto: 원래 요청의 스킴(http/https). 백엔드의 secure 판단 근거.
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  # ── OAuth2 소셜 로그인 프록시 ──
  # 로그인 시작(/oauth2/authorization/{kakao|google})과 콜백(/login/oauth2/code/*)은
  # /api/ 밑이 아니라 루트 경로라 별도 location이 필요하다. production 메인은 React(80)가
  # 맡지만, 이 학습용 프론트(8070)도 같은 구조를 유지한다. X-Forwarded-Host 로 백엔드가
  # redirect_uri 를 접속한 공개 주소로 만들게 한다(백엔드 forward-headers-strategy 와 짝).
  location ~ ^/(oauth2|login/oauth2)/ {
    proxy_pass http://$backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $fwd_port;
  }

  # ── 정적 자산 캐시 ──
  # location ~* \.(css|js)$: 확장자가 .css/.js 로 끝나는 요청에 매칭(~*는 대소문자 무시 정규식).
  #   순수 JS 버전은 자산이 루트에 평면 배치(app.js, styles.css)라 확장자로 잡는다.
  location ~* \.(css|js)$ {
    # expires: 브라우저 캐시 유효기간(응답에 Expires/Cache-Control max-age 부여). 실습용 짧게.
    expires 5m;
    # add_header Cache-Control "public": 공용 캐시(프록시·CDN)도 저장 허용.
    add_header Cache-Control "public";
  }
}
