# React 빌드 산출물(dist)을 서빙 + /api 프록시. 순수 JS 버전과 동일한 구조.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    # SPA 폴백: 없는 경로는 index.html 로 (React 라우팅 대비)
    try_files $uri $uri/ /index.html;
  }

  # /api/ 요청을 백엔드 컨테이너(board-app)로 프록시 → 브라우저 same-origin(CORS 불필요)
  location /api/ {
    proxy_pass http://board-app:8090;   # 경로(/)를 붙이지 않아 원본 URI 그대로 전달
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite 빌드 자산은 파일명에 해시가 붙으므로 장기 캐시 가능(실습용 짧게)
  location /assets/ {
    expires 5m;
    add_header Cache-Control "public";
  }
}
