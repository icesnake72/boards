# React 빌드 산출물(dist)을 서빙 + /api 프록시. 순수 JS 버전과 동일한 구조.
# (지시어 설명은 frontend/nginx.conf 와 동일하며, 차이는 맨 아래 자산 캐시 블록뿐이다.)

# server: 하나의 가상 호스트를 정의한다.
server {
  # listen: 컨테이너 내부 대기 포트 80(밖에서 8071로 매핑).
  listen 80;
  # server_name: 받을 호스트명. "_"는 기본 서버(아무 이름이나).
  server_name _;

  # ── 정적 파일 서빙 ──
  # root: 정적 파일 최상위 디렉터리(여기에 Vite 빌드 산출물 dist가 복사됨).
  root /usr/share/nginx/html;
  # index: 디렉터리(/) 요청 시 기본 파일.
  index index.html;

  # location /: 기본 규칙(더 구체적인 location이 우선).
  location / {
    # try_files: $uri → $uri/ → 없으면 /index.html 로 폴백.
    #   React 라우팅(react-router 등)을 넣으면 이 폴백이 필수가 된다
    #   (/boards/1 새로고침 시 서버엔 파일이 없어 404 → index.html로 떨어뜨려야 React가 그림).
    try_files $uri $uri/ /index.html;
  }

  # ── API 프록시 ──
  # location /api/: "/api/"로 시작하는 요청만 처리 → 백엔드로 넘긴다(브라우저 same-origin, CORS 불필요).
  location /api/ {
    # proxy_pass: 넘길 대상. 경로(/) 미부착 → 원본 URI(/api/v1/boards) 그대로 전달.
    #   "board-app"은 같은 docker 네트워크의 백엔드 컨테이너명(DNS 해석).
    proxy_pass http://board-app:8090;
    # proxy_http_version: 백엔드와 HTTP/1.1 통신.
    proxy_http_version 1.1;
    # proxy_set_header: 백엔드로 전달할 헤더 보정.
    proxy_set_header Host $host;                               # 원 호스트명(백엔드 baseUrl 계산용)
    proxy_set_header X-Real-IP $remote_addr;                   # 실제 클라이언트 IP
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 프록시/클라 IP 체인
    proxy_set_header X-Forwarded-Proto $scheme;               # 원 스킴(http/https) — secure 판단 근거
  }

  # ── 정적 자산 캐시 (순수 JS 버전과 유일하게 다른 부분) ──
  # location /assets/: 경로 접두어로 매칭. Vite는 번들을 /assets/ 아래에 해시 파일명
  #   (예: index-CNc_kvD6.js)으로 생성하므로, 확장자 정규식 대신 경로로 통째 잡는다.
  #   해시 파일명이라 내용이 바뀌면 이름도 바뀌어, 운영에선 장기(immutable) 캐시가 가능하다.
  location /assets/ {
    # expires: 캐시 유효기간(실습용 짧게 5분).
    expires 5m;
    # add_header Cache-Control "public": 공용 캐시 저장 허용.
    add_header Cache-Control "public";
  }
}
