# 프론트 컨테이너의 Nginx 설정.
# 역할 2가지: (1) 정적 파일(HTML/CSS/JS) 서빙, (2) /api/ 요청을 백엔드로 프록시.
# 프론트와 API가 같은 origin(이 nginx)으로 보이므로 브라우저 CORS 문제가 사라진다.
server {
  listen 80;
  server_name _;

  # (1) 정적 파일 서빙
  root /usr/share/nginx/html;
  index index.html;

  location / {
    # SPA는 아니지만, 없는 경로는 index.html로 폴백(단순화)
    try_files $uri $uri/ /index.html;
  }

  # (2) API 프록시 — /api/ 로 시작하는 요청을 백엔드 컨테이너로 넘긴다.
  # proxy_pass 뒤에 경로(/)를 붙이지 않아야 원본 URI(/api/v1/boards)가 그대로 전달된다.
  # "board-app" 은 같은 docker 네트워크(board-db-net)의 백엔드 컨테이너명(DNS로 해석).
  location /api/ {
    proxy_pass http://board-app:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 정적 자산 캐시(실습용 짧게)
  location ~* \.(css|js)$ {
    expires 5m;
    add_header Cache-Control "public";
  }
}
