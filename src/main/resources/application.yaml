server:
  port: 8090

spring:
  application:
    name: board
  config:
    # .env 파일을 properties 형식으로 로드한다 (optional: 없어도 기동은 됨).
    # KEY=VALUE 줄이 그대로 프로퍼티가 되어 ${KAKAO_SECRET} 같은 placeholder가 해석된다.
    # 같은 이름의 OS 환경변수가 있으면 그쪽이 우선한다.
    import: optional:file:.env[.properties]

  # 단계 8: OAuth 표준화 — oauth2-client의 표준 프로퍼티.
  # 구글/깃허브와 달리 카카오는 CommonOAuth2Provider에 없어 provider 블록을 직접 기술한다.
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API}
            client-secret: ${KAKAO_SECRET}
            # {baseUrl}이 실행 환경에 맞게 치환된다 → http://localhost:8090/login/oauth2/code/kakao
            # 이 표준 경로를 카카오 콘솔 Redirect URI에 등록해야 한다 (단계 7 경로와 다름!)
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            # 카카오 token endpoint는 Basic 헤더가 아니라 form 본문의 client_id/secret을 요구한다
            client-authentication-method: client_secret_post
            scope: profile_nickname
          # 단계 8 확장: 구글 — CommonOAuth2Provider에 내장이라 provider 블록이 필요 없다(카카오와의 대비).
          # 단계 9: scope에 openid를 추가 → 구글 로그인이 OIDC 경로로 전환된다.
          # openid가 있으면 토큰 응답에 id_token(JWT)이 실려 오고, 사용자 로딩은
          # DefaultOAuth2UserService가 아니라 OidcUserService(→ CustomOidcUserService)가 담당한다.
          # 카카오는 순수 OAuth2 그대로 — 두 경로의 대비가 이 단계의 학습 포인트다.
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # scope: profile,email  # 단계 9 처리에 의해 제거 — 단계 8은 openid를 빼서 OIDC 경로를 회피했었다
            scope: openid,profile,email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            # 사용자 응답에서 "이 사람의 이름"으로 쓸 최상위 속성 → authentication.getName() = 카카오 회원번호
            user-name-attribute: id
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:board}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 강의 편의상 update 사용. 운영에서는 validate + Flyway/Liquibase 같은 마이그레이션 도구 권장
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  # 단계 10: multipart 업로드 크기 제한 — 초과 시 MaxUploadSizeExceededException(413)로 응답
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

jwt:
  secret: ${JWT_SECRET:bG9jYWwtZGV2LWp3dC1zZWNyZXQta2V5LWZvci1ib2FyZC1sZWN0dXJlLTI1Ng==}  # Base64, 로컬 강의용 기본값 (HS256 최소 256비트)
  access-token-validity-seconds: 3600  # 1시간
  refresh-token-validity-seconds: 1209600  # 14일

# refresh token을 담는 httpOnly 쿠키 옵션 (단계 5)
app:
  # 단계 10: 업로드 파일 저장 루트. 상대경로면 앱 실행 디렉터리 기준. 운영에선 절대경로/전용 볼륨 권장.
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads}

  refresh-cookie:
    name: refreshToken
    # 운영(HTTPS)에선 반드시 true. 로컬은 HTTP라 true면 쿠키가 전송되지 않아 테스트가 깨진다.
    secure: ${APP_REFRESH_COOKIE_SECURE:false}
    same-site: Strict
    # reissue/logout 모두 이 경로 아래라 쿠키가 전송된다. 노출 면적을 auth 경로로 좁힌다.
    path: /api/v1/auth

  # 단계 7: 카카오 OAuth2 (authorization code 수동 구현)
  oauth:
    kakao:
      # REST API Key(client_id) — 인가 URL에 노출되는 값이라 비밀은 아니지만, .env로 관리한다
      appkey: ${KAKAO_REST_API}
      # Client Secret — 진짜 비밀값. yaml에 기본값을 두지 않는다(.env 또는 환경변수 필수).
      # 해석 안 된 placeholder는 "${KAKAO_SECRET}" 문자열 그대로 바인딩되므로(!),
      # KakaoOAuthProperties의 compact constructor가 기동 시점에 검증해 즉시 실패시킨다(fail-fast).
      secret: ${KAKAO_SECRET}
      # CALL BACK REDIRECT URI — 카카오 콘솔 [카카오 로그인 > Redirect URI]에 "완전히 동일한 문자열"로 등록 필수
      callback: ${KAKAO_CALLBACK:http://localhost:8090/api/oauth/kakao/callback}
      # 카카오 고정 엔드포인트 — 인가(브라우저 리다이렉트) / 토큰 교환(서버) / 사용자 정보(서버)
      authorize-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me


logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.security.web.FilterChainProxy: DEBUG
    # 단계 9: OAuth2/OIDC 처리 흐름(CustomOidcUserService 등)의 debug 로그를 보기 위함
    com.example.board.auth.oauth2: debug
