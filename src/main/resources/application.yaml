server:
  port: 8090

spring:
  application:
    name: board
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:board}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 강의 편의상 update 사용. 운영에서는 validate + Flyway/Liquibase 같은 마이그레이션 도구 권장
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:bG9jYWwtZGV2LWp3dC1zZWNyZXQta2V5LWZvci1ib2FyZC1sZWN0dXJlLTI1Ng==}  # Base64, 로컬 강의용 기본값 (HS256 최소 256비트)
  access-token-validity-seconds: 3600  # 1시간
  refresh-token-validity-seconds: 1209600  # 14일

# refresh token을 담는 httpOnly 쿠키 옵션 (단계 5)
app:
  refresh-cookie:
    name: refreshToken
    # 운영(HTTPS)에선 반드시 true. 로컬은 HTTP라 true면 쿠키가 전송되지 않아 테스트가 깨진다.
    secure: ${APP_REFRESH_COOKIE_SECURE:false}
    same-site: Strict
    # reissue/logout 모두 이 경로 아래라 쿠키가 전송된다. 노출 면적을 auth 경로로 좁힌다.
    path: /api/v1/auth

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.security.web.FilterChainProxy: DEBUG
