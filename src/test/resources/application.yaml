spring:
  datasource:
    url: jdbc:h2:mem:board;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

jwt:
  secret: bG9jYWwtZGV2LWp3dC1zZWNyZXQta2V5LWZvci1ib2FyZC1sZWN0dXJlLTI1Ng==
  access-token-validity-seconds: 3600
  refresh-token-validity-seconds: 1209600

app:
  refresh-cookie:
    name: refreshToken
    secure: false
    same-site: Strict
    path: /api/v1/auth

  # 테스트는 KakaoOAuthClient를 mock하므로 실제로 호출되지 않는 더미 값
  oauth:
    kakao:
      appkey: test-appkey
      secret: test-secret
      callback: http://localhost:8090/api/oauth/kakao/callback
      authorize-uri: https://kauth.kakao.com/oauth/authorize
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
