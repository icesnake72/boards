# ────────────────────────────────────────────────────────────────────────────
# GitHub Actions CI/CD — AWS Lightsail 배포
#
# 흐름: (1) test 잡에서 빌드·테스트(H2) 통과 확인 → (2) deploy 잡에서 Lightsail에
#       SSH 접속 → 코드 최신화 → scripts/deploy.sh 실행.
#       실제 배포 로직(.env 생성, DB 준비, compose up --wait)은 저장소의
#       scripts/deploy.sh 에 있다 — 워크플로는 "언제·어디서" 만, 스크립트는 "무엇을" 담당.
#
# 전제: 서버에 Docker/Compose가 설치돼 있어야 한다(그 외 네트워크·mysql-8·클론은 자동).
#
# 필요한 GitHub Secrets(설정 방법은 docs/lecture/CICD-GITHUB-ACTIONS.md 참고):
#   LIGHTSAIL_HOST, LIGHTSAIL_USER, LIGHTSAIL_SSH_KEY,
#   KAKAO_REST_API, KAKAO_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
#   DB_NAME, DB_USERNAME, DB_PASSWORD
# ────────────────────────────────────────────────────────────────────────────
name: Deploy to Lightsail

# 언제 실행되나 — main 브랜치에 push될 때 자동 + Actions 탭에서 수동(workflow_dispatch)
on:
  push:
    branches: ["main"]      # 다른 브랜치를 배포하려면 여기와 아래 origin/main 을 함께 변경
    paths-ignore:           # 문서만 바뀐 커밋은 재배포하지 않는다(서버 재빌드 낭비 방지)
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:        # 수동 트리거 버튼(코드 변경 없이 재배포할 때)

# 동시에 여러 배포가 겹치지 않게 — 새 실행이 뜨면 진행 중인 이전 배포는 취소
concurrency:
  group: deploy-lightsail
  cancel-in-progress: true

jobs:
  # ── 1) 빌드·테스트 게이트 — 테스트가 깨지면 배포하지 않는다(H2라 외부 의존 없음) ──
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v5

      - name: JDK 21 설치(Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle           # gradle 의존성 캐시로 재실행 가속

      - name: 테스트 실행(H2)
        run: chmod +x ./gradlew && ./gradlew --no-daemon test

  # ── 2) 배포 — test 성공 후에만(needs). 서버에서 scripts/deploy.sh 가 일한다 ──
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Lightsail SSH 접속 후 배포
        uses: appleboy/ssh-action@v1.2.0
        # Secrets를 러너 env로 먼저 노출해야 envs:가 원격 셸로 전달할 수 있다.
        env:
          KAKAO_REST_API: ${{ secrets.KAKAO_REST_API }}
          KAKAO_SECRET: ${{ secrets.KAKAO_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}          # webserver_key.pem 전체 내용
          envs: KAKAO_REST_API,KAKAO_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,DB_NAME,DB_USERNAME,DB_PASSWORD
          # 원격에서 할 일: 코드 최신화 → 배포 스크립트 실행 (로직은 scripts/deploy.sh 참고)
          script: |
            set -e
            [ -d ~/board/.git ] || git clone https://github.com/icesnake72/boards.git ~/board
            cd ~/board
            git fetch --all && git reset --hard origin/main
            ./scripts/deploy.sh
